<body>
<div class="product-grid">
  <div class="product-card" *ngFor="let product of products">
    <div id = "head"><h3>{{ product.name }}</h3></div>
    <div id="product_body">
         <div id = "img_div">
          <img [src]="product.image" [alt]="product.name" class="product-image"> 
         </div>
         <div id = "body_down">
           <p>{{ product.description }}</p>
           <h4 class="rating">Rating: {{product.rating}}</h4>
         </div>
        
    </div>
   <div id = "down_side">
 <a [href]="product.link" target="_blank">View on Kaspi.kz</a>
    <button (click)="shareProduct(product)">Share</button>
   </div>
    
   
  </div>
</div>  
</body>
